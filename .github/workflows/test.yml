name: Forecast regression tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: scripts/generate_html
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r ../../requirements.txt
      - run: python -m compileall -q core modules tools main.py server.py
      - name: Check JavaScript templates
        run: |
          foreach ($file in Get-ChildItem templates -Filter *.js) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: python -m unittest discover -s tests
